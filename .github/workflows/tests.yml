name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  operational-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GDAL system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run operational tests
        run: python -m pytest -q
      - name: Run local operational smoke test
        run: python scripts/local_operational_smoke.py
      - name: Validate deployment scaffold
        run: python scripts/validate_docker_deployment.py
